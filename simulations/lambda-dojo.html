/* ---- motivating and historical openings for each chapter ---- */
const HIST=[null,
 {body:`<p>Church needed a notation for functions given by rules rather than by graphs. Ordinary mathematical usage names a function before using it and leaves its argument implicit in a formula; the λ-notation does neither, writing the function itself as an object and marking explicitly which variable is the argument. The distinction between <em>x²</em> as a number depending on x and λx. x² as a function is the entire point of the notation, and it is why the calculus can treat functions as arguments to other functions without further apparatus.</p>`,
  beat:{say:'Church required a notation for functions given by a rule rather than by a graph, in which the argument is marked explicitly and the function itself is an object. The distinction between the expression x² and the function λx. x² is the whole purpose of the notation, and it is what permits functions to be passed to other functions without additional apparatus.'}},
 {body:`<p>That a function of two arguments may be presented as a function of one argument returning a function was observed by Schönfinkel in 1924 and used systematically by Curry, after whom the transformation is now named. The λ-calculus adopts it as the only available convention: there are no functions of several arguments to be transformed.</p>`,
  beat:{say:'That a function of two arguments may be presented as a function of one returning a function was observed by Schönfinkel in 1924 and used systematically by Curry, whose name it now carries. The calculus adopts it as the only convention available: there are no functions of several arguments in the first place.'}},
 {body:`<p>After the collapse of the full system in 1935, the pressing question was whether the surviving equational theory was itself trivial — whether every term could be proved equal to every other. Church and Rosser answered it in 1936 by proving confluence, from which consistency follows immediately. The reduction strategies analysed below were later found to be the evaluation orders of actual languages: leftmost–outermost reduction is call-by-name, formalised together with call-by-value by Plotkin in 1975, and implemented with sharing as lazy evaluation following Wadsworth (1971).</p>`,
  beat:{say:'After the inconsistency of 1935 the pressing question was whether the surviving equational theory was itself trivial, every term provably equal to every other. Church and Rosser settled it in 1936 by proving confluence. The strategies analysed here were later identified with the evaluation orders of real languages: leftmost–outermost reduction is call-by-name, formalised alongside call-by-value by Plotkin in 1975.'}},
 {body:`<p>The calculus contains functions and nothing else, so if it is to compute with data at all, data must be represented by functions. Church\u2019s solution was to represent a datum by its own use: since a boolean is consumed only by choosing between two alternatives, it is identified with that choice. The construction looks like a trick and is in fact the general principle, as the chapter on encoded data makes precise.</p>`,
  beat:{say:'The calculus contains functions and nothing else, so data must be represented by functions if they are to be represented at all. Church\u2019s device was to represent a datum by its own use: a boolean is consumed only by selecting one of two alternatives, so it is identified with that selection.'}},
 {body:`<p>Church\u2019s representation of the natural numbers, introduced in the early 1930s, was the instrument with which λ-definability was investigated: the theorems of Kleene, Church and Turing on effective calculability are theorems about the functions definable on these numerals. The encoding also produced the first hard technical problem of the subject, the predecessor, which resisted Church and his students for some time.</p>`,
  beat:{say:'Church\u2019s representation of the natural numbers was the instrument with which λ-definability was studied: the results of Kleene, Church and Turing on effective calculability concern the functions definable on these numerals. It also produced the first hard technical problem of the subject, the predecessor.'}},
 {body:`<p>The pair, the list and the numeral are all encoded by the same manoeuvre, and it took fifty years for the manoeuvre to be identified. Böhm and Berarducci showed in 1985 that the representation of a datum by its own iterator is not a collection of ad hoc devices but a uniform and adequate encoding of inductive types, and that the type of the encoding is the type of the induction principle.</p>`,
  beat:{say:'Pairs, lists and numerals are all encoded by one manoeuvre, and it took fifty years for the manoeuvre to be identified. Böhm and Berarducci showed in 1985 that representing a datum by its own iterator is a uniform and adequate encoding of inductive types, whose type is that of the corresponding induction principle.'}},
 {body:`<p>Self-application is the feature that made Church\u2019s original system inconsistent, and it is also the feature that makes recursion available without any recursive definition mechanism. Curry\u2019s paradoxical combinator, so named for that reason, converts the defect into a tool; Turing gave a different fixed-point combinator in 1937. The two readings — paradox and recursion — are the same phenomenon, and the typed calculi of the following chapters remove both at once.</p>`,
  beat:{say:'Self-application is what made Church\u2019s original system inconsistent, and equally what makes recursion available with no recursive definition mechanism. Curry\u2019s paradoxical combinator, so named for precisely that reason, converts the defect into an instrument; Turing gave a different fixed-point combinator in 1937.'}},
 {body:`<p>Schönfinkel\u2019s 1924 paper <em>Über die Bausteine der mathematischen Logik</em> set out to remove bound variables from logic entirely, on the grounds that they are the source of the syntactic complications — capture, renaming, scope — encountered in the previous chapters. Curry rediscovered and developed the programme from 1930. The result is of practical as well as foundational interest: Turner\u2019s SKI reduction machine (1979) implemented a functional language by exactly this translation.</p>`,
  beat:{say:'Schönfinkel\u2019s paper of 1924 set out to remove bound variables from logic altogether, on the grounds that capture, renaming and scope are the source of its syntactic complications. Curry rediscovered and developed the programme from 1930, and Turner\u2019s reduction machine of 1979 implemented a functional language by precisely this translation.'}},
 {body:`<p>Types entered logic as a remedy for paradox: Russell\u2019s theory of types (1908) stratified the universe so that a set could not be applied to itself, and Church\u2019s simple theory of types (1940) did the same for his calculus, restoring the consistency lost in 1935. The typing discipline below is therefore not a programming convenience retrofitted to the calculus; it is the original repair, and its restrictive character is the intended effect.</p>`,
  beat:{say:'Types entered logic as a remedy for paradox. Russell\u2019s theory of types (1908) stratified the universe so that a set could not be applied to itself, and Church\u2019s simple theory of types (1940) did the same for his calculus, restoring the consistency lost in 1935. The discipline below is that repair, and its restrictive character is the intended effect.'}},
 {body:`<p>Church\u2019s typed calculus requires every abstraction to be annotated with the type of its variable. Hindley observed in 1969, in the setting of combinatory logic, that the annotations are redundant: a most general type can be computed from the term alone. Milner arrived at the same algorithm independently while designing the metalanguage of the LCF proof assistant, where the requirement was practical — users were writing proof tactics and would not annotate them — and Damas and Milner published the system and its correctness proof in 1982.</p>`,
  beat:{say:'Church\u2019s typed calculus annotates every abstraction with the type of its variable. Hindley observed in 1969 that the annotations are redundant, a most general type being computable from the term alone; Milner arrived at the same algorithm independently while designing the metalanguage of the LCF proof assistant, where users writing proof tactics would not tolerate annotation.'}},
 {body:`<p>Curry noticed in the 1930s that the types of his basic combinators are precisely the axiom schemes of implicational propositional logic, and pursued the observation with Feys through the 1950s. Howard extended it to full natural deduction in a manuscript of 1969 that circulated for eleven years before publication in 1980. De Bruijn had arrived at the same principle independently while building Automath, the first system in which mathematics was checked by machine. What follows is that correspondence, stated as an identity of two systems rather than an analogy between them.</p>`,
  beat:{say:'Curry noticed in the 1930s that the types of his basic combinators are exactly the axiom schemes of implicational propositional logic. Howard extended the observation to full natural deduction in a manuscript of 1969, circulated for eleven years before publication; de Bruijn reached the same principle independently while building Automath, the first system in which mathematics was machine-checked.'}},
 {body:`<p>Each of the following extensions was obtained at least twice, independently, which is some evidence that the objects are not arbitrary: System F by Girard (1972) in proof theory and by Reynolds (1974) in programming language theory; the propositions-as-types principle by Curry, Howard and de Bruijn; the categorical semantics by Lambek and by Scott. The subject is now large enough that these are separate literatures, and the notes below indicate only where each begins.</p>`,
  beat:{say:'Each extension below was obtained at least twice, independently: System F by Girard (1972) in proof theory and by Reynolds (1974) in programming languages; propositions-as-types by Curry, Howard and de Bruijn; the categorical semantics by Lambek and by Scott. That is some evidence that the objects are not arbitrary.'}}
];
CH.forEach((c,i)=>{ if(HIST[i]&&HIST[i].body) c.body = HIST[i].body + c.body; });
BEATS.forEach((bs,i)=>{ if(HIST[i]&&HIST[i].beat) bs.unshift(HIST[i].beat); });

/* ============================================================ *
 *  6. UI
 * ============================================================ */
const $=id=>document.getElementById(id);
let cur=0, state={term:null,trace:[],pos:0,playing:0}, done={};
const saveDone=()=>{};

let mode='guided', beatPos=CH.map(()=>0), beatOK={};
function buildNav(){
  $('nav').innerHTML=CH.map((c,i)=>
    `<li><button class="${i===cur?'on':''} ${done[i]?'done':''}" data-i="${i}"><span class="num">${i}</span>${c.t}</button></li>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();window.scrollTo({top:0,behavior:'smooth'});});
}
$('mGuided').onclick=()=>{mode='guided';render();};
$('mRef').onclick=()=>{mode='ref';render();};

function chipsHtml(c){
  return `<p class="chiphead">Terms for the bench:</p><div class="chips">`+
    c.tries.map(s=>`<button class="chip" data-s="${s.replace(/"/g,'&quot;')}">${show(parse(s),{sugar:false})}</button>`).join('')+`</div>`;
}
function drillHtml(d,i,passed){
  const key=cur+':'+i, done=passed||beatOK[key];
  let inner;
  if(d.k==='mc'){
    inner=`<div class="opts">`+d.opts.map((o,j)=>
      `<button class="opt ${d.mono?'mono':''} ${done&&j===d.a?'right':''}" data-b="${i}" data-o="${j}" ${done?'disabled':''}>${o.replace(/\\/g,'λ')}</button>`).join('')+`</div>`;
  }else{
    inner=`<input type="text" spellcheck="false" data-nf="${i}" placeholder="normal form" ${done?'disabled':''} value="${done?d.a.replace(/"/g,'&quot;'):''}">`+
          `<button class="btn" data-nfb="${i}" ${done?'disabled':''}>Check</button>`;
  }
  return `<div class="drill"><p class="q">${d.q}</p>${inner}<p class="why ${done?'ok':''}" data-w="${i}">${done?d.why:''}</p></div>`;
}
function renderGuided(c){
  const bs=BEATS[cur]||[];
  const at=Math.min(beatPos[cur],Math.max(bs.length-1,0));
  let h=`<h2>${c.t}</h2><p class="kicker">${c.k}</p>`;
  for(let i=0;i<=at;i++){
    const b=bs[i];
    h+=`<div class="beat${i===at?' on':''}"><p>${b.say}</p>`;
    if(b.drill)h+=drillHtml(b.drill,i,i<at);
    h+=`</div>`;
  }
  const last=at>=bs.length-1;
  const gated=bs[at]&&bs[at].drill&&!beatOK[cur+':'+at];
  h+=`<div class="controls">`;
  if(!last)h+=`<button class="btn ${gated?'':'pri'}" id="nextbeat">${gated?'Continue without answering':'Continue'}</button>`;
  else h+=`<span class="readout">${c.task?'Section complete. Exercise below.':'Section complete.'}</span>`;
  h+=`<button class="btn" id="allref">Continuous text</button>`;
  if(cur<CH.length-1&&last)h+=`<button class="btn" id="nextch">Next chapter</button>`;
  h+=`</div>`;
  return {h,at,last,bs};
}
function render(){
  const c=CH[cur];
  buildNav();
  $('mGuided').className=mode==='guided'?'on':'';
  $('mRef').className=mode==='ref'?'on':'';
  if(mode==='ref'){
    $('lesson').innerHTML=`<h2>${c.t}</h2><p class="kicker">${c.k}</p>${c.body}`;
    $('chips').innerHTML=chipsHtml(c);
    $('src').value=c.tries[0];
    renderTask(c.task);
  }else{
    const g=renderGuided(c);
    $('lesson').innerHTML=g.h;
    $('chips').innerHTML=g.last?chipsHtml(c):'';
    const b=g.bs[g.at];
    if(b&&b.load)$('src').value=b.load;
    else if(g.at===0&&g.bs[0]&&!g.bs[0].load)$('src').value=c.tries[0];
    renderTask(g.last?c.task:null);
    wireBeats(g);
  }
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('src').value=b.dataset.s;runAll();});
  runAll();
}
function wireBeats(g){
  const nb=$('nextbeat');
  if(nb)nb.onclick=()=>{beatPos[cur]=Math.min(beatPos[cur]+1,g.bs.length-1);render();};
  $('allref').onclick=()=>{mode='ref';render();};
  const nc=$('nextch'); if(nc)nc.onclick=()=>{cur++;render();window.scrollTo({top:0,behavior:'smooth'});};
  const d=g.bs[g.at]&&g.bs[g.at].drill;
  if(!d)return;
  const key=cur+':'+g.at, why=document.querySelector(`[data-w="${g.at}"]`);
  if(d.k==='mc'){
    document.querySelectorAll(`[data-o]`).forEach(btn=>btn.onclick=()=>{
      const j=+btn.dataset.o;
      if(j===d.a){beatOK[key]=1;why.className='why ok';why.innerHTML=d.why;
        document.querySelectorAll('[data-o]').forEach(b2=>{b2.disabled=true;if(+b2.dataset.o===d.a)b2.classList.add('right');});
        const n=$('nextbeat'); if(n){n.className='btn pri';n.textContent='Next';}
      }else{btn.classList.add('wrong');why.className='why no';why.innerHTML='Incorrect.';}
    });
  }else{
    const inp=document.querySelector(`[data-nf="${g.at}"]`), bt=document.querySelector(`[data-nfb="${g.at}"]`);
    const go=()=>{
      let u; try{u=parse(inp.value);}catch(e){why.className='why no';why.innerHTML='Parse error — '+e.message;return;}
      const got=normalize(u,ENV,{full:true,max:60000}), want=normalize(parse(d.a),ENV,{full:true,max:60000});
      if(!got.stalled&&aeq(got.t,want.t)){
        beatOK[key]=1;why.className='why ok';why.innerHTML=d.why;inp.disabled=true;bt.disabled=true;
        const n=$('nextbeat'); if(n){n.className='btn pri';n.textContent='Next';}
      }else{why.className='why no';why.innerHTML='Not the normal form. Load the term on the bench to inspect the reduction.';}
    };
    bt.onclick=go;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  }
}

/* ---- bench ---- */
function readTerm(){
  const s=$('src').value.trim();
  if(!s)throw new Error('nothing to reduce');
  return parse(s);
}
function runAll(){
  let t;
  try{t=readTerm();}
  catch(e){$('tape').innerHTML=`<div class="err">parse error — ${e.message}</div>`;$('typeline').textContent='';$('ribbon').innerHTML='';$('readout').textContent='';return;}
  const logic=$('logic').checked;
  try{
    const r=typeOfTerm(t,logic);
    $('typeline').className='typeline';
    $('typeline').innerHTML=`<small>${logic?'derives':'principal type'}</small>${r.str}`+
      (r.free.length?` <small style="margin-left:14px">in context</small>${r.free.join(', ')}`:'');
  }catch(e){
    $('typeline').className='typeline bad';
    $('typeline').innerHTML=`<small>no type</small>${e.message}`;
  }
  const res=normalize(t,ENV,{trace:true,max:2000});
  state.term=t; state.trace=res.trace; state.res=res; state.pos=res.trace.length;
  drawTape(res); drawRibbon(res);
  $('readout').textContent=`${res.steps} contraction${res.steps===1?'':'s'}${res.stalled?', halted at the step budget':''} · size ${size(res.t)}`;
}
function drawTape(res){
  const sugar=$('sugar').checked;
  const rows=res.trace.map((e,i)=>
    `<div class="row" data-i="${i}"><span class="rule">${e.rule}</span><span class="term">${show(e.term,{html:true,sugar,redex:e.redex})}</span></div>`);
  rows.push(`<div class="row final"><span class="rule">${res.stalled?'⋯':'normal form'}</span><span class="term">${show(res.t,{html:true,sugar})}</span></div>`);
  $('tape').innerHTML=rows.join('');
  $('tape').querySelectorAll('.row[data-i]').forEach(r=>r.onclick=()=>{
    const e=res.trace[+r.dataset.i]; $('src').value=show(e.term,{sugar:false}); runAll();
  });
}
function drawRibbon(res){
  const sizes=res.trace.map(e=>e.size).concat([size(res.t)]);
  const max=Math.max.apply(null,sizes), n=Math.min(sizes.length,160);
  const st=Math.max(1,Math.floor(sizes.length/n));
  let h='';
  for(let i=0;i<sizes.length;i+=st)h+=`<i style="height:${Math.max(2,100*sizes[i]/max)}%" class="${sizes[i]===max?'hot':''}" title="step ${i}: size ${sizes[i]}"></i>`;
  $('ribbon').innerHTML=h;
}
$('run').onclick=runAll;
$('stepb').onclick=()=>{
  let t; try{t=readTerm();}catch(e){return runAll();}
  const r=step(t,ENV,new Set(),false,true);
  if(!r){$('readout').textContent='in normal form';return;}
  $('src').value=show(r.t,{sugar:false}); runAll();
};
$('play').onclick=function(){
  if(state.playing){clearInterval(state.playing);state.playing=0;this.textContent='Run';return;}
  this.textContent='Halt';
  state.playing=setInterval(()=>{
    let t; try{t=readTerm();}catch(e){clearInterval(state.playing);state.playing=0;$('play').textContent='Run';return;}
    const r=step(t,ENV,new Set(),false,true);
    if(!r){clearInterval(state.playing);state.playing=0;$('play').textContent='Run';return;}
    $('src').value=show(r.t,{sugar:false}); runAll();
  },360);
};
$('ski').onclick=()=>{
  try{const t=readTerm(); $('src').value=show(toSKI(t),{sugar:false}); runAll();}
  catch(e){}
};
$('sugar').onchange=runAll; $('logic').onchange=runAll;
$('src').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();runAll();}});

/* ---- challenges ---- */
function renderTask(k){
  if(!k){$('task').innerHTML='';return;}
  const tests=k.kind==='behav'
    ? `<p class="tests">${k.tests.map(([a,b])=>`<span>${a} ⟶ ${b}</span>`).join('')}</p>`
    : `<p class="tests"><span>goal: ${k.target.replace(/->/g,'→').replace(/\*/g,'×')}</span>${k.allow.length?`<span>allowed constants: ${k.allow.join(' ')}</span>`:''}</p>`;
  $('task').innerHTML=`<div class="task">
    <div class="head"><h4>Exercise (${k.kind==='type'?'inhabitation':'construction'}) — ${k.name}</h4><p>${k.prompt}</p></div>
    <div class="body">${tests}
      <textarea id="ans" rows="2" spellcheck="false">${k.starter}</textarea>
      <div class="controls">
        <button class="btn pri" id="check">Check</button>
        <button class="btn" id="tobench">Load on bench</button>
        <button class="btn" id="hintb">Hint</button>
        <button class="btn" id="solb">Reveal a solution</button>
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="reveal" id="reveal"></div>
    </div></div>`;
  $('check').onclick=()=>checkTask(k);
  $('tobench').onclick=()=>{$('src').value=$('ans').value;runAll();window.scrollTo({top:$('src').offsetTop-120,behavior:'smooth'});};
  $('hintb').onclick=()=>{$('reveal').className='reveal show';$('reveal').textContent='Hint. '+k.hint.replace(/<[^>]+>/g,'');};
  $('solb').onclick=()=>{$('reveal').className='reveal show';$('reveal').textContent='One solution: '+k.sol;};
  $('ans').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();checkTask(k);}});
}
function verdict(ok,msg){
  const v=$('verdict'); v.className='verdict '+(ok?'ok':'no'); v.textContent=msg;
  if(ok){done[cur]=1;saveDone();buildNav();}
}
function hasLam(t){return t.t==='lam'||(t.t==='app'&&(hasLam(t.f)||hasLam(t.a)))||(t.t==='let');}
function checkTask(k){
  let u;
  try{u=parse($('ans').value);}catch(e){return verdict(false,'parse error — '+e.message);}
  if(k.forbid){
    const f=fv(u), bad=k.forbid.filter(n=>f.has(n));
    if(bad.length)return verdict(false,'The answer uses '+bad.join(', ')+', which is excluded for this exercise.');
  }
  if(k.noLam&&hasLam(u))return verdict(false,'The answer must contain no abstraction.');
  if(k.kind==='behav'){
    const env=Object.assign({},ENV); env[k.name]=u;
    for(const [lhs,rhs] of k.tests){
      let got,want;
      try{
        got=normalize(parse(lhs),env,{full:true,max:60000});
        want=normalize(parse(rhs),env,{full:true,max:60000});
      }catch(e){return verdict(false,'error on '+lhs+' — '+e.message);}
      if(got.stalled)return verdict(false,lhs+' reached no normal form within the step budget');
      if(!aeq(got.t,want.t))
        return verdict(false,lhs+' ↠ '+show(got.t,{sugar:true})+', expected '+rhs);
    }
    return verdict(true,'All '+k.tests.length+' test cases agree up to α-equivalence. ✓');
  }
  // type challenge
  const allowed=new Set(k.allow||[]);
  const stray=[...fv(u)].filter(n=>!allowed.has(n));
  if(stray.length)return verdict(false,'free variable'+(stray.length>1?'s':'')+' '+stray.join(', ')+': a free variable receives an unconstrained type and would inhabit any proposition. Submit a closed term (permitted constants: '+((k.allow||[]).join(' ')||'none')+').');
  let sc;
  try{const s=new Map(); const ty=infer(u,TENV,s,{}); sc=gen({},ty,s);}
  catch(e){return verdict(false,'Untypable: '+e.message);}
  const s2=new Map();
  try{ unify(inst(sc,s2),parseType(k.target),s2); }
  catch(e){ return verdict(false,'Principal type '+showT(sc.type,new Map())+'; the stated type is not an instance of it.'); }
  return verdict(true,'Accepted. Principal type '+showT(sc.type,new Map())+' ✓');
}

/* ---- prelude reference, appended to the last chapter ---- */
function preludeTable(){
  return `<h3 style="font-size:16px;margin:34px 0 4px">The definitions, with their principal types where they exist</h3>
  <table><tr><th>constant</th><th>definition</th><th>principal type (Hindley–Milner)</th></tr>`+
  PRE.map(([n,src])=>{
    const ty=TYPEOF[n];
    return `<tr><td class="n">${n}</td><td class="d">${src.replace(/\\/g,'λ').replace(/</g,'&lt;')}</td>
      <td class="t ${ty.ok?'':'bad'}">${ty.ok?ty.str+(ty.ax?' (axiom)':''):'— '+ty.str}</td></tr>`;
  }).join('')+`</table>`;
}
CH[CH.length-1].body+=preludeTable();

render();
/* one orchestrated moment on load: run a reduction once */
const calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!calm){
  $('src').value='add 2 3'; runAll();
  let i=0; const iv=setInterval(()=>{
    let t; try{t=readTerm();}catch(e){clearInterval(iv);return;}
    const r=step(t,ENV,new Set(),false,true);
    if(!r||i++>14){clearInterval(iv);$('src').value=CH[0].tries[0];runAll();return;}
    $('src').value=show(r.t,{sugar:false}); runAll();
  },170);
}
</script>
